<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>


    <header>

        <h1>
            Student Internship Management System
        </h1>

    </header>


    <section>

        <h2>
            Admin Login
        </h2>

        <p>
            Login to manage students, internships and applications.
        </p>


        <form onsubmit="adminLogin(event)">


            <label>
                Admin Email
            </label>

            <input
                type="email"
                id="adminEmail"
                placeholder="Enter admin email"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                id="adminPassword"
                placeholder="Enter password"
                required
            >


            <button type="submit">
                Login
            </button>


        </form>


        <br>


        <a href="index.html">
            Back to Home
        </a>

    </section>


    <footer>

        <p>
            © 2026 Student Internship Management System
        </p>

    </footer>


    <script>

        function adminLogin(event) {

            event.preventDefault();

            let email =
                document.getElementById("adminEmail").value;

            let password =
                document.getElementById("adminPassword").value;


            if (
                email === "admin@gmail.com" &&
                password === "admin123"
            ) {

                alert(
                    "Admin login successful!"
                );

                window.location.href =
                    "admin-dashboard.html";

            } else {

                alert(
                    "Invalid admin email or password!"
                );

            }

        }

    </script>


</body>

</html>
